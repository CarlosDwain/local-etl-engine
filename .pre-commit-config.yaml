repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: import-linter
        name: import-linter (architecture rules)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
